services:
  frontend:
    build: .
    ports: ['3000:3000']
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build: ./backend
    ports: ['8000:8000']
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://manakai:manakai@postgres:5432/manakai
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: manakai
      POSTGRES_USER: manakai
      POSTGRES_PASSWORD: manakai
    ports: ['5432:5432']
    volumes: ['manakai_pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U manakai -d manakai']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  manakai_pgdata:
