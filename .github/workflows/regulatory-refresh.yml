name: Authoritative regulatory source refresh

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: authoritative-regulatory-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Require the Neon connection secret
        run: test -n "$DATABASE_URL"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply additive migrations once
        working-directory: backend
        run: alembic -c alembic.ini upgrade head

  refresh:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: staging
      DEMO_MODE: 'false'
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      REFRESH_GROUP: ${{ matrix.product_group }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        product_group:
          - Electrical appliances
          - Kitchen electrical appliances
          - Domestic appliances
          - Construction materials
          - Hallmarking
          - Personal safety
          - Personal-care electrical appliances
          - Lighting
          - Wood products
          - Glass products
          - Electrical accessories
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Check this source group without overwriting verified facts
        working-directory: backend
        run: python -m app.ingestion refresh --group "$REFRESH_GROUP" --max-sources 20

  reconcile:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: staging
      DEMO_MODE: 'false'
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Reconcile the reviewed manifest
        working-directory: backend
        run: python -m app.ingestion all-authoritative
      - name: Report unresolved source reviews
        working-directory: backend
        run: python -m app.ingestion review-report --fail-on-pending
