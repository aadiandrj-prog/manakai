name: Authoritative regulatory source refresh

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: authoritative-regulatory-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: staging
      DEMO_MODE: 'false'
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Require the Neon connection secret
        run: test -n "$DATABASE_URL"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Check official sources without overwriting verified facts
        working-directory: backend
        run: python -m app.ingestion refresh --fail-on-change
      - name: Reconcile captured authoritative verticals independently
        working-directory: backend
        run: python -m app.ingestion all-authoritative
