services:
  - type: web
    name: manakai-staging-api
    runtime: docker
    plan: free
    region: ohio
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: sh start-free-staging.sh
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: EXPECTED_SCHEMA_REVISION
        value: d7e2c9a4f610
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_DAILY_REQUEST_LIMIT
        value: "40"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "500"
      - key: AI_MAX_INPUT_CHARS
        value: "8000"
      - key: AI_MAX_RETRIES
        value: "0"
      - key: CHAT_RATE_LIMIT_REQUESTS
        value: "10"
      - key: ANALYSIS_RATE_LIMIT_REQUESTS
        value: "20"
